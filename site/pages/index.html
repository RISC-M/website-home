<!doctype html>
<html lang="en" class="no-scrollbar">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>RISC-M | UMICH Computer Architecture</title>
  <meta name="description"
    content="A community of engineers building real, cutting-edge computer architecture projects." />
  <link rel="canonical" href="https://www.risc-m.com/" />

  <!-- Google Site Name Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "RISC-M Computer Architecture Club",
    "alternateName": ["RISC-M", "RISC-M Club"],
    "url": "https://www.risc-m.com/"
  }
  </script>

  <link rel="icon" href="/images/logo-white.png" type="image/png" />
  <link rel="apple-touch-icon" href="/images/logo-white.png" />

  <!-- Open Graph -->
  <meta property="og:site_name" content="RISC-M Computer Architecture Club" />
  <meta property="og:title" content="RISC-M | UMICH Computer Architecture" />
  <meta property="og:description"
    content="A community of engineers building real, cutting-edge computer architecture projects." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.risc-m.com/" />
  <meta property="og:image" content="https://www.risc-m.com/images/logo-black.png" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="RISC-M | UMICH Computer Architecture" />
  <meta name="twitter:description"
    content="A community of engineers building real, cutting-edge computer architecture projects." />
  <meta name="twitter:image" content="https://www.risc-m.com/images/logo-black.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            display: ['Inter', '-apple-system', 'sans-serif'],
            outfit: ['Outfit', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="/styles/site.css" />
  <noscript>
    <style>
      .reveal-on-scroll {
        opacity: 1 !important;
        transform: none !important;
        filter: none !important;
      }
    </style>
  </noscript>
</head>

<body
  class="relative min-h-screen bg-[#fcfcfc] text-black font-sans overflow-x-hidden selection:bg-black selection:text-white pb-6 no-scrollbar">
  <!-- Global Dotted Background Grid -->
  <div
    class="absolute inset-0 bg-[radial-gradient(#e5e5e5_1.5px,transparent_1.5px)] [background-size:24px_24px] pointer-events-none -z-10">
  </div>
  <!-- Scroll Progress Bar -->
  <div id="scroll-progress" class="fixed top-0 left-0 h-1 bg-black z-50 transition-all duration-100" style="width: 0%">
  </div>

  <!-- Header / Navbar -->
  <header
    class="flex flex-wrap gap-3 justify-center sm:justify-between items-center px-4 sm:px-8 py-3 md:py-4 border-b border-black text-xs md:text-sm font-semibold uppercase tracking-widest fixed top-0 left-0 w-full bg-[#fcfcfc]/90 backdrop-blur-md z-50">
    <div class="flex items-center gap-4 lg:gap-8">
      <div class="flex items-center gap-2">
        <div class="w-2.5 h-2.5 bg-black rounded-full animate-pulse shadow-[0_0_8px_rgba(0,0,0,0.6)]"></div>
        <a href="#about"
          class="anchor-link whitespace-nowrap hover:opacity-70 transition-opacity text-xl md:text-base font-bold tracking-tighter uppercase font-outfit">RISC-M</a>
      </div>
    </div>

    <div class="flex justify-end items-center gap-4 md:gap-6">
      <nav class="flex gap-3 lg:gap-6 text-xs md:text-sm" aria-label="Main Navigation">
        <a href="#about" class="anchor-link hover:text-gray-500 transition-colors">Home</a>
        <a href="about.html" class="text-gray-500 hover:text-black transition-colors">About</a>
        <a href="sponsorship.html" class="text-gray-500 hover:text-black transition-colors">Sponsorship</a>
        <a href="/showcase/" class="text-gray-500 hover:text-black transition-colors">Showcase</a>
      </nav>
    </div>
  </header>

  <main class="px-8 pt-20 md:pt-28 max-w-[1400px] mx-auto relative flex flex-col items-center">
    <!-- 1. ABOUT / HERO -->
    <section id="about"
      class="w-full min-h-[75vh] flex flex-col items-center justify-center text-center px-8 py-16 md:py-24">
      <div class="max-w-4xl mx-auto flex flex-col items-center float-up-hero">

        <!-- Logo Black above RISC-M -->
        <img src="/images/logo-black.png" alt="RISC-M Silicon Logo"
          class="w-36 sm:w-48 md:w-56 lg:w-64 h-auto mb-8 select-none hover:scale-105 transition-transform duration-300 pointer-events-none drop-shadow-sm" />

        <!-- Hero Title -->
        <h1 id="hero-title"
          class="text-[clamp(3.75rem,14vw,12rem)] font-bold tracking-tighter uppercase leading-none text-black mb-4 w-full select-none font-outfit">
          RISC-M
        </h1>

        <!-- Greyscale Dots under Title -->
        <div class="flex justify-center gap-4 mb-6">
          <span
            class="w-3.5 h-3.5 rounded-full bg-black shadow-[0_0_8px_rgba(0,0,0,0.3)] hover:scale-125 transition-transform cursor-pointer"></span>
          <span
            class="w-3.5 h-3.5 rounded-full bg-neutral-600 shadow-[0_0_8px_rgba(82,82,82,0.3)] hover:scale-125 transition-transform cursor-pointer"></span>
          <span
            class="w-3.5 h-3.5 rounded-full bg-neutral-400 shadow-[0_0_8px_rgba(163,163,163,0.3)] hover:scale-125 transition-transform cursor-pointer"></span>
          <span
            class="w-3.5 h-3.5 rounded-full bg-neutral-200 shadow-[0_0_8px_rgba(229,229,229,0.3)] hover:scale-125 transition-transform cursor-pointer"></span>
        </div>

        <!-- Core Tagline -->
        <p class="text-xl sm:text-2xl md:text-3xl font-semibold leading-relaxed text-black max-w-3xl mb-6">
          A community of engineers building real, cutting-edge computer architecture projects.
        </p>

      </div>
    </section>

    <!-- 2. MEMBERSHIP & JOINING -->
    <section id="join"
      class="w-full border-t border-black pt-16 md:pt-24 pb-16 flex flex-col items-center text-center reveal-on-scroll">
      <div class="text-center mb-8 max-w-3xl mx-auto">
        <h3 class="text-3xl md:text-5xl lg:text-6xl font-bold uppercase tracking-tighter text-black mb-4 font-display">
          Join
        </h3>
        <p class="text-lg sm:text-xl font-normal text-neutral-600 max-w-xl mx-auto mb-8">
          Watch out for more information coming your way W27.
        </p>

        <div class="flex justify-center">
          <span class="btn-wrapper inline-block">
            <a href="https://forms.gle/cFrikohNdQu2sLo69" target="_blank" rel="noopener noreferrer"
              class="inline-flex items-center gap-3 border border-black bg-black text-white px-8 py-4 rounded-lg font-semibold uppercase tracking-widest text-xs sm:text-sm hover-offset-button">
              Join Mailing List
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
              </svg>
            </a>
          </span>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer
      class="w-full border-t border-black pt-6 pb-2 mt-12 flex flex-col md:flex-row justify-between items-center gap-4 text-xs font-semibold uppercase tracking-widest anim-element d-7">
      <p class="text-xs font-semibold uppercase tracking-widest">&copy; 2026 <span class="font-outfit">RISC-M</span></p>
      <div class="flex gap-6 text-xs font-semibold uppercase tracking-widest">
        <a href="mailto:riscm-exec@umich.edu" class="hover:text-gray-500 transition-colors">email</a>
        <a href="https://www.linkedin.com/company/risc-m/" class="hover:text-gray-500 transition-colors" target="_blank"
          rel="noopener noreferrer">linkedin</a>
      </div>
    </footer>
  </main>
  <script src="https://unpkg.com/lenis@1.1.2/dist/lenis.min.js"></script>
  <script src="/scripts/site.js" defer></script>
</body>

</html>
